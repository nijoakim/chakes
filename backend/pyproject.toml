[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "engine",
    "fastapi",
    "uvicorn[standard]",
]

[tool.uv.sources]
engine = { workspace = true }

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
